# A made-up platform, declared as a package outside FINN would declare its own: a board, a
# linker, a runtime, a moved mover kind and a shell on them, with no change to FINN. Its
# code is support.example_platform's.

[boards.Example-ZU3]
part = "xczu3eg-sbva484-1-e"

[linkers.example-link]
# Writes the description it is given and a stub image.
code = "support.example_platform:link"
tool = "example-tool"
board_keys = ["slot"]
image = "example-image"

[runtimes.example-run]
# Records the operations it is asked for.
code = "support.example_platform:RecordingRuntime"
images = ["example-image"]
movers = ["example_dma"]
kinds = ["moved"]
schemas = [1]

[movers.example_dma]
# A mover of the platform's own, moving each frame between memory and a boundary channel.
code = "support.example_platform:ExampleDma"
kinds = ["moved"]

[shells.example]
# pynq's facts, with its own linker, runtime and mover, and no characterisation of its own.
based_on = "pynq"
linker = "example-link"
runtimes = ["example-run"]
supply = [{ kind = "moved", movers = ["example_dma"], width_cap = 128 }]
delivery = [{ kind = "moved", movers = ["example_dma"], width_cap = 128 }]
characterised = "nothing: a made-up shell"
timed = []
caveat = "the 'example' shell is made up: on {board} ({part}) nothing is measured"

[shells.example.boards.Ultra96]
slot = "A"

[shells.example.boards.Example-ZU3]
slot = "B"
versions = ">=1.0"
