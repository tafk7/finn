# FINN sandbox profiles.
#
# Two shapes of agent, separated by the one boundary that actually contains
# anything:
#
#   dev    the default. Closed egress, no Xilinx mount, no licence. Runs
#          quicktest.sh, the non-Vivado pytest subset, linting and every
#          import-level task - which is the whole inner loop for work on FINN's
#          Python. Nothing in this profile can reach the corporate network.
#
#   build  opt-in, and a deliberate widening. Mounts one Xilinx version
#          read-only and sets XILINXD_LICENSE_FILE, which is a floating FLEXlm
#          server spoken to over raw TCP. sbxc's egress control compiles domain
#          ACLs into an HTTP/CONNECT proxy and has no primitive for "allow one
#          TCP host:port", so this profile must run open posture - meaning full
#          network reach, including the rest of the internal RFC1918 space. An
#          agent with a prompt-injection bug here has a TCP path into the
#          corporate network. Use it only when synthesis is actually the task.
#
# Run one build agent at a time: floating licences are seat-counted, and two
# agents on one working tree race the git index.
#
# The images are FINN's own, not built here. Resolve them with:
#
#   ./run-docker.sh build dev
#   FINN_XILINX_PATH=... ./run-docker.sh build build
#
# base_command asks run-docker.sh for the tag rather than duplicating the tag
# rule, so these profiles cannot drift from what run-docker.sh produces. It is
# resolved at up-time only and never on the `plan` path.

schema = 1
name = "finn"
default_agent = "dev"
backend = "docker"

[defaults]
harnesses = ["claude", "opencode"]
default_harness = "claude"

# Open is the honest base: the build profile genuinely needs it, and sbxc only
# lets an agent HARDEN a base posture, never open it. The dev agent below
# closes itself, so the default_agent is the contained one.
[network]
posture = "open"

# --- images ------------------------------------------------------------------

[images.finn-dev]
base_command = ["./run-docker.sh", "print-tag", "dev"]
harnesses = ["claude", "opencode"]
# finn_entrypoint.sh derives FINN_ROOT and sources the Xilinx tools, so PID 1's
# environment is not something `docker exec` would otherwise inherit.
inherit_entrypoint_env = true

[images.finn-build]
base_command = ["./run-docker.sh", "print-tag", "build"]
harnesses = ["claude", "opencode"]
inherit_entrypoint_env = true

# --- dev: the contained default ----------------------------------------------

[agents.dev]
image = "finn-dev"
workspace = "direct"

# Deny by default. No overlay.Dockerfile is needed to carry configuration,
# because the static environment is baked as ENV in the image - which is also
# what makes this profile portable to the sbx backend, whose create path has no
# env injection seam.
[agents.dev.network]
posture = "closed"
allow = [
  # Python packages: pip, and the wheels themselves.
  "pypi.org",
  "files.pythonhosted.org",
  # Dependency checkouts. fetch-repos.sh clones qonnx/brevitas/finn-experimental
  # over https, and codeload serves the archive redirects.
  "github.com",
  "codeload.github.com",
  "objects.githubusercontent.com",
  "raw.githubusercontent.com",
]

# --- build: opt-in, open posture ---------------------------------------------

[agents.build]
image = "finn-build"
workspace = "direct"

[agents.build.network]
posture = "open"

# Mount exactly one Xilinx version, read-only. The full install is 267 GB across
# two versions; mounting both when one is needed doubles the exposure for
# nothing. Point FINN_XILINX_PATH at the versioned directory, not the root.
[[agents.build.mounts.extra]]
host = "${FINN_XILINX_PATH}"
mode = "ro"

[agents.build.env]
FINN_XILINX_PATH = "${FINN_XILINX_PATH}"
FINN_XILINX_VERSION = "${FINN_XILINX_VERSION}"
XILINXD_LICENSE_FILE = "${XILINXD_LICENSE_FILE}"
