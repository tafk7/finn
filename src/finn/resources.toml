# FINN's resources: its own sources used in place, and directory trees it uses but does not contain.
# Each is fetched from its pinned source on first use and verified against its
# digest. See finn/resources/__init__.py, or run `finn-resources list`.
#
# To move a pin: finn-resources update NAME --ref REF
# To try a local checkout: FINN_RESOURCES_<NAME>=/path/to/checkout

[resources.hlslib]
description = "finn-hlslib HLS C++ library"
kind = ["hls-include"]
redistributable = true
git = "https://github.com/Xilinx/finn-hlslib.git"
commit = "8d979e2bdced486dd25d26607d1ff5ae327ed6a8"
digest = "sha256:eaeda81ff5f5c12ad413bcd346dac0b039cc2738368f99aef5d5ce8743a3c989"

# Vivado board files. Third-party files FINN does not redistribute; each root is
# a separate Vivado board repository path.

# FinnLib: the RTL and HLS sources of finn.kernels and of the MVAU/VVAU replay
# buffer. It is private and changes with FINN, so it is not redistributable and
# is never baked into an image: developers point FINN_RESOURCES_FINNLIB at a
# working clone, and the pin records which commit a FINN revision was validated
# against. Fetching needs SSH access to the repository.
[resources.finnlib]
description = "FinnLib RTL and HLS component library"
kind = ["kernel-sources"]
redistributable = false
git = "git@gitenterprise.xilinx.com:tkeller/finnlib.git"
commit = "229b35f6e148fd0c67c16f0d2d99d9f8d821a5f8"
digest = "sha256:1b2fd63d7c71e275ebddb481a306f0e38476fd1f555fa0e13ca6e6c30f8bb64e"

