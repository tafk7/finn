# FINN's own sources, shipped in the wheel and used in place. Declared so that
# other code finds them by name rather than location, and so that each can be
# replaced with a directory of your own, e.g. FINN_RESOURCES_XSI=/path/to/src.
[resources.xsi]
description = "Sources of the finn_xsi simulation bridge"
redistributable = true
package = "finn.xsi"
subdir = "src"
