# FINN's resources: its own trees, and directory trees it uses but does not contain.
# Fetched resources come from their pinned commit on first use and are verified
# against their digest. See finn/resources/__init__.py, or run `finn resources list`.
#
# To move a pin: scripts/update-resource.py NAME --ref REF
# To try a local checkout: FINN_RESOURCES_<NAME>=/path/to/checkout
# Only kinds that FINN asks for are declared: hls-include, vivado-boards.

# FINN's own trees: package data under finn/_sources (in a checkout, symbolic links
# to the trees beside the package).

# finn-rtllib: FINN's RTL component library
[resources.rtllib]
package = "finn"
subdir = "_sources/rtllib"

# finn_xsi: the XSim bridge's C++ sources and Python adapter
[resources.finn-xsi]
package = "finn"
subdir = "_sources/finn-xsi"

# FINN's C++ helpers, driver templates and example data
[resources.qnn-data]
package = "finn"
subdir = "qnn-data"

# finn-hlslib HLS C++ library
[resources.hlslib]
kind = ["hls-include"]
redistributable = true
git = "https://github.com/Xilinx/finn-hlslib.git"
commit = "0718fbf45d5276bef31bc030d9389eb8b971105f"
digest = "sha256:d27058fba2cc8888fce05b25339707fa9f750f0ab6145a72e26e3dd00fd819a2"

# custom_hls: FINN's own HLS headers
[resources.custom-hls]
kind = ["hls-include"]
package = "finn"
subdir = "_sources/custom-hls"

# Vivado board files. Third-party files FINN does not redistribute; each root is
# a separate Vivado board repository path.

# Avnet board files (Ultra96, ZedBoard, MicroZed and others)
[resources.avnet-boards]
kind = ["vivado-boards"]
