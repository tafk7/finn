# Recorded evidence is reference material, not maintained code.
exclude: '^(docs/conf.py|docs/(kernel|space)-[^/]+/)'

default_language_version:
    python: python3.12

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
    exclude: '\.dat$'
  - id: check-added-large-files
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
  - id: check-xml
  - id: check-yaml
  - id: debug-statements
    exclude: '^src/finn/builder/build_dataflow.py$'
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: mixed-line-ending
    args: ['--fix=no']

# Two formatters, split by path. The code the gates check (scripts/check-*.sh,
# gate_ruff) is ruff's, formatted and linted as the gates do: .ruff.toml's
# selection plus I (sorted imports). FINN's upstream-era code keeps upstream's
# isort and black, so a merge from upstream is not buried under a reformat; ruff
# only lints it, with .ruff.toml's selection. The gates check that every file
# they format is in &gate_ruff (scripts/_gate_precommit.py).
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.4
  hooks:
  - id: ruff-check
    name: ruff check (gate paths)
    args: [--extend-select, I, --fix]
    files: &gate_ruff '^(src/finn/(core/space|dataflow|kernels|platform|custom_op/kernels|transformation/kernels|harness)/|tests/(core/space|dataflow|kernels|kernel_ops|xsim_sweep)/|tests/(layering|value_classes)\.py$|scripts/(benchmark-space|_gate_precommit|emitted_text)\.py$|src/finn/builder/kernel_testbench\.py$)'
  - id: ruff-format
    files: *gate_ruff
  - id: ruff-check
    exclude: *gate_ruff

- repo: https://github.com/PyCQA/isort
  rev: 5.12.0
  hooks:
  - id: isort
    exclude: *gate_ruff

- repo: https://github.com/psf/black
  rev: 23.3.0
  hooks:
  - id: black
    language_version: python3
    args: [--line-length=100]
    exclude: *gate_ruff
