{
  "schemaVersion": "1",
  "args": {
    "template": {
      "required": true,
      "description": "Image reference from docker/build --sbx --print-tag"
    },
    "agent": {
      "default": "shell",
      "description": "Agent to run: shell, or a coding agent such as claude"
    }
  },
  "name": "finn",
  "agent": "${{ env.args.agent }}",
  "workspace": ".",
  "sandboxOptions": {
    "template": "${{ env.args.template }}",
    "pullPolicy": "never",
    "skills": "off"
  },
  "env": {
    "FINN_BUILD_DIR": "/tmp/finn_build"
  }
}
