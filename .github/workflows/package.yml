name: Package

# Development and the images use FINN editable, which hides packaging mistakes
# (a resource missing from the wheel, a broken entry point). This builds the
# wheels and uses them from a clean environment, with no checkout on the path.

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      lowest:
        description: "Also test the lowest versions the dependency ranges allow"
        type: boolean
        default: false

jobs:

  wheel:
    name: Build and use the wheels
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Build wheels
        run: |
          uv build --out-dir dist .
          uv build --out-dir dist packages/finn-hlslib

      - name: Install the wheels into a clean environment
        # Dependencies at the locked versions; FINN and finn-hlslib from the wheels.
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/finn-wheel uv sync --frozen --no-default-groups \
            --no-install-workspace --extra hw
          uv pip install --python /tmp/finn-wheel/bin/python --no-deps dist/*.whl

      - name: Use the installed package outside the checkout
        working-directory: /tmp
        run: |
          /tmp/finn-wheel/bin/python -I "$GITHUB_WORKSPACE/tests/util/runtime_resource_smoke.py" /tmp/smoke
          /tmp/finn-wheel/bin/build_dataflow --help
          /tmp/finn-wheel/bin/python -I -c \
            "from finn.util.external import hlslib_path; import finn; print(hlslib_path())"

      - name: Published metadata resolves
        # What `pip install finn` would need from PyPI (resolution only).
        run: |
          uv venv --python 3.12 /tmp/finn-pypi
          uv pip install --python /tmp/finn-pypi/bin/python --dry-run dist/finn-*.whl

  python311:
    # Development and the images use Python 3.12; the published metadata also
    # allows 3.11. Run the unit tests there at the locked versions.
    name: Unit tests on Python 3.11
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Install at the locked versions
        # uv.lock covers 3.12 only, so export its versions as constraints.
        run: |
          uv export --frozen --no-hashes --no-header --no-annotate --no-emit-workspace \
            | sed -e 's/ ;.*//' -e '/^-e /d' > /tmp/locked.txt
          uv venv --python 3.11 /tmp/finn311
          uv pip install --python /tmp/finn311/bin/python --index-strategy unsafe-best-match \
            -c /tmp/locked.txt -e . -e packages/finn-hlslib --group dev

      - name: Unit tests
        run: |
          export FINN_ROOT="$PWD" FINN_BUILD_DIR=/tmp/finn_build
          /tmp/finn311/bin/python -m pytest -q -n auto -m "not vivado and not slow" \
            tests/util tests/transformation

  lowest:
    name: Lowest allowed dependency versions
    if: github.event_name == 'workflow_dispatch' && inputs.lowest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Resolve the bottom of the ranges and run the unit tests
        run: |
          uv lock --resolution lowest-direct
          uv sync
          uv run pytest -q -m "util or transform or streamline" -k "not vivado"
