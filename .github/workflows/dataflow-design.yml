name: Dataflow design

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/finn/dataflow/**"
      - "tests/dataflow/**"
      - "scripts/check-dataflow-design.sh"
      - "setup.cfg"
      - ".github/workflows/dataflow-design.yml"
  push:
    branches: [main, dev]
    paths:
      - "src/finn/dataflow/**"
      - "tests/dataflow/**"
      - "scripts/check-dataflow-design.sh"
      - "setup.cfg"
      - ".github/workflows/dataflow-design.yml"

jobs:
  engine-core:
    name: Engine core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run engine parity suite
        env:
          PYTHONPATH: src:tests
        run: python -m pytest -q --confcutdir=tests/dataflow/engine tests/dataflow/engine

  design-layer:
    name: Region and design integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install focused verification dependencies
        run: python -m pip install build mypy pytest ruff
      - name: Run focused checks
        run: ./scripts/check-dataflow-design.sh
      - name: Build wheel
        run: python -m build --wheel
      - name: Inspect and import wheel
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {
              "finn/dataflow/_engine/__init__.py",
              "finn/dataflow/_engine/engine.py",
              "finn/dataflow/_engine/py.typed",
              "finn/dataflow/design/__init__.py",
              "finn/dataflow/design/region.py",
              "finn/dataflow/mvau_design.py",
          }
          assert expected <= names
          assert not any(name.startswith("design_space/") for name in names)
          assert not any("scratchpad" in name or "__pycache__" in name for name in names)
          PY
          python -m pip install --no-deps --target /tmp/finn-dataflow-wheel dist/*.whl
          PYTHONPATH=/tmp/finn-dataflow-wheel python -c "import finn.dataflow._engine; import finn.dataflow.design"
