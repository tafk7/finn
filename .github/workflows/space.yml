name: Space

on:
  pull_request:
    paths:
      - "src/finn/core/space/**"
      - "tests/core/space/**"
      - "scripts/check-space*"
      - "requirements-space-test.txt"
      - "setup.cfg"
      - ".ruff.toml"
      - ".github/workflows/space.yml"
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-space-test.txt
      - run: python -m pip install -r requirements-space-test.txt
      - run: bash scripts/check-space.sh
