name: LocalInstallQuicktest

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

jobs:

  test:
    name: Run quicktest with local installation (no Docker)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo ./scripts/install-system-deps.sh

      # The uv version is pyproject.toml's required-version.
      - uses: astral-sh/setup-uv@v6

      - name: Install FINN
        run: uv sync --locked

      - name: Run quicktest
        run: |
          export FINN_BUILD_DIR=/tmp/finn_gha
          source .venv/bin/activate
          ./scripts/quicktest-local.sh
