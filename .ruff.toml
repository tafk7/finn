line-length = 100

exclude = [
    "*.ipynb",
]

[lint]
select = ["E", "F", "PLC", "TID251"]

# FINN starts external processes only through finn.util.launcher (run_tool), which
# checks the exit status and keeps a replay script and transcripts.
[lint.flake8-tidy-imports.banned-api]
"subprocess.run".msg = "use finn.util.launcher.run_tool"
"subprocess.Popen".msg = "use finn.util.launcher.run_tool"
"subprocess.call".msg = "use finn.util.launcher.run_tool"
"subprocess.check_call".msg = "use finn.util.launcher.run_tool"
"subprocess.check_output".msg = "use finn.util.launcher.run_tool"
"os.system".msg = "use finn.util.launcher.run_tool"
"os.popen".msg = "use finn.util.launcher.run_tool"

[lint.per-file-ignores]
"src/finn/util/launcher.py" = ["TID251"]
# Tests drive processes themselves; the CI harness runs without FINN installed.
"tests/**" = ["TID251"]
"ci/**" = ["TID251"]
# The container launcher runs on the host, without FINN installed.
"docker/**" = ["TID251"]
# The image build runs finn.resources from its own directory, before FINN is installed.
"src/finn/resources/**" = ["TID251"]
# A maintainer's script on the resources' standard-library implementation.
"scripts/update-resource.py" = ["TID251"]
