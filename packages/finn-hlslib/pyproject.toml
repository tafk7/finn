# Packages the finn-hlslib HLS C++ library (a git submodule at finn_hlslib/hlslib)
# as data, so FINN can depend on it like any other package. In FINN's development
# workspace it is installed editable, so edits to the submodule take effect directly.
[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-hlslib"
version = "0.1.0"
description = "finn-hlslib HLS C++ headers, packaged as data for FINN"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/Xilinx/finn-hlslib"

[tool.setuptools]
packages = ["finn_hlslib"]
include-package-data = false

[tool.setuptools.package-data]
finn_hlslib = ["hlslib/**/*"]

[tool.setuptools.exclude-package-data]
finn_hlslib = ["hlslib/.git", "hlslib/.github/**"]
