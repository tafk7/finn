# FINN sandbox environment, base layer.
#
# Layered with fpga.sbxenv.yaml for the toolchain tiers. Do not run this from
# where it sits -- docker/finn-sbx copies it outside every mounted workspace
# first, because an environment file the agent can edit is a file the agent can
# use to widen its own next sandbox.
#
# Every ${VAR} is interpolated from the host by sbx; finn-sbx exports them from
# `finn-env inspect`. See docs/containerization.md, "The sbx template contract",
# for what sbx does and does not interpolate, and why.

schemaVersion: "1"

name: "${FINN_SBX_NAME}"
agent: "${FINN_SBX_AGENT}"

# Absolute: a relative path would resolve from the materialised copy, not the
# repo. sbx mounts at the host path and cannot remap, so this is always mirror.
workspace: "${FINN_WORKSPACE_SOURCE}"

# MEASURED: these reach a bare `sbx exec <s> sh -c 'echo $FINN_ROOT'` with no
# shell and no hook. That is what retired docker/finn.kit -- the kit existed to
# set these two as real process env, on the belief that only a kit could, and it
# was a second declaration of values this file already owns.
env:
  FINN_ROOT: "${FINN_WORKSPACE_SOURCE}"
  # Inside the VM, deliberately -- not a host mount, so not the host default.
  # A build tree that outlives the sandbox has nowhere to live. The uid in a
  # sandbox is always agent(1000), so this needs no per-user suffix.
  FINN_BUILD_DIR: /tmp/finn_build
  FINN_DEPS: "${FINN_DEPS}"

sandboxOptions:
  template: "${FINN_SBX_TEMPLATE}"
  # never, not the `always` default: the template is built locally and loaded
  # into sbx's own store, so a pull would fail with what looks like an auth
  # error.
  pullPolicy: never
