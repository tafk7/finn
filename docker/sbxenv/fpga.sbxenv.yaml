# FINN sandbox environment, toolchain overlay. Layered over base.sbxenv.yaml
# for the build tiers:
#
#   sbx env run base.sbxenv.yaml fpga.sbxenv.yaml
#
# A separate file rather than a conditional, so the dev tier is narrow by
# OMISSION -- it cannot widen because a variable happened to be set in the
# caller's shell, which is the defect class this replaced.
#
# The licence-server network grant is not expressible here; .sbxenv.yaml has no
# network field. finn-sbx applies it after create.

additionalWorkspaces:
  # The whole Xilinx root, read-only. The root rather than $ROOT/$VERSION
  # because AMD reorganised the tree after 2024.2 and probing one layout
  # silently mounted nothing on sites using the other.
  - path: "${FINN_XILINX_PATH}"
    readOnly: true

env:
  XILINX_VIVADO: "${XILINX_VIVADO}"
  XILINX_VITIS: "${XILINX_VITIS}"
  XILINX_HLS: "${XILINX_HLS}"
  VIVADO_PATH: "${VIVADO_PATH}"
  VITIS_PATH: "${VITIS_PATH}"
  HLS_PATH: "${HLS_PATH}"
  XILINXD_LICENSE_FILE: "${XILINXD_LICENSE_FILE}"
