# FINN Repository Configuration
# Defines all external dependencies and their versions

repositories:
  # Python dependencies (installed as editable packages)
  qonnx:
    url: https://github.com/fastmachinelearning/qonnx.git
    commit: ed339373246d84626cf8e1d9038a8acad7111031
    type: python
    install: editable
    
  finn-experimental:
    url: https://github.com/Xilinx/finn-experimental.git
    commit: 0724be21111a21f0d81a072fccc1c446e053f851
    type: python
    install: editable
    
  brevitas:
    url: https://github.com/Xilinx/brevitas.git
    commit: 4617f7bd136e96fa21c7f76e3c7e2e37fe563837
    type: python
    install: editable
    
  # C++ dependencies
  finn-hlslib:
    url: https://github.com/Xilinx/finn-hlslib.git
    commit: 5c5ad631e3602a8dd5bd3399a016477a407d6ee7
    type: cpp
    
  cnpy:
    url: https://github.com/maltanar/cnpy.git
    commit: 8c82362372ce600bbd1cf11d64661ab69d38d7de
    type: cpp
    
  # Other dependencies
  oh-my-xilinx:
    url: https://github.com/maltanar/oh-my-xilinx.git
    commit: 0b59762f9e4c4f7e5aa535ee9bc29f292434ca7a
    type: other
    
  pyxsi:
    url: https://github.com/maltanar/pyxsi.git
    commit: 941bb62a4a3cc2c8cf2a9b89187c60bb0b776658
    type: other

