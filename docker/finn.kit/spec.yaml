# FINN sbx kit. Delivers what cannot be baked, because it depends on where the
# workspace is mounted -- known only at sandbox creation.
#
# See docs/containerization.md, "The sbx template contract", for the licensing
# forms, the schema-version difference, and why this is a kit and not the
# entrypoint.

schemaVersion: "2"
kind: mixin
name: finn

environment:
  variables:
    # ${WORKSPACE_DIR} is interpolated by sbx at create time. This is the one
    # value that genuinely cannot be baked: the workspace has no fixed path.
    # See LIMITATION(finn-root-absolute) in docker/finn_paths.py.
    FINN_ROOT: "${WORKSPACE_DIR}"
    # Scratch for generated HLS/Vivado projects. Inside the VM on purpose: a
    # build tree that outlives the sandbox has nowhere to live, and writing it
    # into the mounted workspace is what this redesign removed.
    FINN_BUILD_DIR: "/tmp/finn_build"

setup:
  startup:
    # user "0" because startup commands default to "1000" (agent) and both of
    # these touch root-owned paths. Two other constraints from the kit
    # reference, both learned the hard way here:
    #   - the dispatcher STOPS on a failed command, so one that cannot succeed
    #     silently disables every command after it;
    #   - startup commands replay on every container restart, so they must be
    #     idempotent. The toolchain block below writes a separate file and
    #     sources it once, rather than appending to the sbx-managed file each
    #     time.
    - command: ["sh", "-c", "mkdir -p /tmp/finn_build && chmod 1777 /tmp/finn_build"]
      user: "0"

    # Make every sbx session source the toolchain, including ones that get no
    # BASH_ENV. /etc/finn-toolchain.sh is BAKED into the image, so there is
    # nothing to generate here -- this only appends the source line to the
    # sbx-managed file.
    #
    # It used to run `finn-env print --format sh` and write the RESULT to
    # /etc/finn-toolchain.sh. That generated file is now a static one, because
    # sourcing the settings scripts (7 ms) turned out to be far cheaper than
    # extracting their effect (124 ms), so there is no reason to precompute.
    #
    # Three dispatcher constraints, each learned by breaking it:
    #   - a non-zero exit STOPS the chain, silently disabling every command
    #     after it, so this must end with exit 0;
    #   - startup commands REPLAY on restart, so this must be idempotent;
    #   - /etc/sandbox-persistent.sh is sbx-managed. Never write its content;
    #     appending one source line at startup is how a kit contributes.
    - command:
        - bash
        - -c
        - |
          [ -r /etc/finn-toolchain.sh ] || exit 0
          grep -q finn-toolchain /etc/sandbox-persistent.sh 2>/dev/null \
            || echo ". /etc/finn-toolchain.sh" >> /etc/sandbox-persistent.sh
          # Explicit success: the dispatcher stops the whole chain otherwise.
          exit 0
      user: "0"
