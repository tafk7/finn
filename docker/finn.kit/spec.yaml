# FINN sbx kit.
#
# Delivers the environment that cannot be baked into the image because it
# depends on where the workspace is mounted, which is only known at sandbox
# creation.
#
# Apply it at create time:
#
#   sbx create claude <repo> --template $(./run-docker.sh print-tag dev) \
#       --kit docker/finn.kit
#
# LICENSING (build tiers)
#
# XILINXD_LICENSE_FILE takes either form, and both are passed with -e:
#
#   PORT@HOST     floating FLEXlm server. Nothing to mount. The sandbox needs
#                 TCP egress to that host, granted narrowly and per-sandbox:
#
#                   sbx policy allow network --sandbox <name> <host>
#
#                 No open posture required - an earlier version of this comment
#                 claimed otherwise and was wrong. Grant the HOST, not
#                 host:port: FLEXlm uses two connections, lmgrd on the
#                 advertised port and a second ephemeral port for the vendor
#                 daemon where the checkout actually happens. A port-scoped
#                 rule lets `lmutil lmstat` succeed and every real checkout
#                 fail. Verified by a synth_design licence checkout.
#   /path/to.lic  node-locked. sbx mounts extra host paths POSITIONALLY, so
#                 mount the containing directory read-only at its own path and
#                 the variable needs no rewriting:
#
#   sbx create claude <repo> <xilinx-version-dir>:ro <licence-dir>:ro \
#       --kit docker/finn.kit -e XILINXD_LICENSE_FILE=/path/to.lic ...
#
# The directory rather than the file: a single-file bind mount cannot
# accommodate sibling files, and some FLEXlm setups keep state beside the
# licence.
#
# UNRESOLVED: both the docker and sbx paths mount that directory :ro, so if
# anything genuinely needs to write there it would fail. Our licence testing
# used the floating PORT@HOST form, which mounts nothing, so this path is
# untested. Either the write claim is wrong or the mount policy is - resolve it
# by testing a node-locked checkout against a named sbx version, not by editing
# this comment. Tracked as conformance test 9 in ci/scripts/conformance.sh.
#
# WHY A KIT AND NOT THE ENTRYPOINT
#
# `sbx exec` starts a process directly in the container and does not go through
# the image ENTRYPOINT, so nothing finn_entrypoint.sh exports is visible to an
# exec session. `environment.variables` below becomes REAL process env, so it
# reaches every invocation style - `bash -c`, `sh -c`, and a bare
# `sbx exec <cmd>` with no shell at all. /etc/sandbox-persistent.sh reaches only
# bash (and is sbx-managed, so the image must not write it).
#
# The image still works with no kit: finn_paths.py resolves the same values from
# WORKSPACE_DIR at interpreter startup. The kit makes them available to
# non-Python consumers too.
#
# SCHEMA: kit schemaVersion 2 (sbx >= 0.36). v1 used `commands:`; v2 uses
# `setup:`. Both are accepted, but v1 is the legacy path, so new kits use v2.
# Grammars must not be mixed: v1 fields in a v2 spec are rejected at decode.
schemaVersion: "2"
kind: mixin
name: finn

environment:
  variables:
    # ${WORKSPACE_DIR} is interpolated by sbx at create time. This is the one
    # value that genuinely cannot be baked: the workspace has no fixed path.
    # See LIMITATION(finn-root-absolute) in docker/finn_paths.py.
    FINN_ROOT: "${WORKSPACE_DIR}"
    # Scratch for generated HLS/Vivado projects. Inside the VM on purpose: a
    # build tree that outlives the sandbox has nowhere to live, and writing it
    # into the mounted workspace is what this redesign removed.
    FINN_BUILD_DIR: "/tmp/finn_build"

setup:
  startup:
    # user "0" because startup commands default to "1000" (agent) and both of
    # these touch root-owned paths. Two other constraints from the kit
    # reference, both learned the hard way here:
    #   - the dispatcher STOPS on a failed command, so one that cannot succeed
    #     silently disables every command after it;
    #   - startup commands replay on every container restart, so they must be
    #     idempotent. The toolchain block below writes a separate file and
    #     sources it once, rather than appending to the sbx-managed file each
    #     time.
    - command: ["sh", "-c", "mkdir -p /tmp/finn_build && chmod 1777 /tmp/finn_build"]
      user: "0"

    # Publish the Xilinx toolchain environment to shell sessions.
    #
    # `sbx exec` does not run the image ENTRYPOINT, so anything the entrypoint
    # sources into PID 1 is invisible to every later session. The image handles
    # that itself now -- BASH_ENV plus the transparent vendor-tool shims -- so
    # this command is an OPTIMISATION, not the mechanism: it resolves the
    # toolchain once at startup instead of letting the first shell pay for it.
    #
    # It delegates to finn-env rather than re-deriving anything. This block used
    # to source settings64.sh itself, which made it a second implementation of
    # logic that also lived in the entrypoint and (in a different form) in
    # run-docker.sh. Every mount defect this redesign fixed came from exactly
    # that shape.
    #
    # Constraints from the kit dispatcher, all learned the hard way:
    #   - it STOPS the chain on a non-zero exit, so this must end with exit 0
    #     or anything added after it is silently disabled;
    #   - startup commands REPLAY on every restart, so this must be idempotent.
    #     It writes /etc/finn-toolchain.sh whole and adds one guarded source
    #     line, rather than appending to the sbx-managed file each time;
    #   - /etc/sandbox-persistent.sh is sbx-managed. The image must never write
    #     its CONTENT, but adding a source line at startup is how sbx expects a
    #     kit to contribute.
    #
    # No-op on the dev tier, which mounts no toolchain.
    - command:
        - bash
        - -c
        - |
          command -v finn-env >/dev/null 2>&1 || exit 0
          finn-env print --format sh > /etc/finn-toolchain.sh.$$ 2>/dev/null || {
            rm -f /etc/finn-toolchain.sh.$$; exit 0
          }
          if [ -s /etc/finn-toolchain.sh.$$ ]; then
            mv -f /etc/finn-toolchain.sh.$$ /etc/finn-toolchain.sh
            chmod 0644 /etc/finn-toolchain.sh
            grep -q finn-toolchain /etc/sandbox-persistent.sh 2>/dev/null \
              || echo ". /etc/finn-toolchain.sh" >> /etc/sandbox-persistent.sh
          else
            rm -f /etc/finn-toolchain.sh.$$
          fi
          # Explicit success: the dispatcher stops the whole chain otherwise.
          exit 0
      user: "0"
