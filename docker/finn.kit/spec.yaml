# FINN sbx kit.
#
# Delivers the environment that cannot be baked into the image because it
# depends on where the workspace is mounted, which is only known at sandbox
# creation.
#
# Apply it at create time:
#
#   sbx create claude <repo> --template $(./run-docker.sh print-tag dev) \
#       --kit docker/finn.kit
#
# LICENSING (build tiers)
#
# XILINXD_LICENSE_FILE takes either form, and both are passed with -e:
#
#   PORT@HOST     floating FLEXlm server. Nothing to mount, but the sandbox
#                 needs raw TCP egress to that host:port - which a
#                 domain-oriented egress policy cannot express, so this
#                 requires open posture. See docs/containerization.md.
#   /path/to.lic  node-locked. sbx mounts extra host paths POSITIONALLY, so
#                 mount the containing directory read-only at its own path and
#                 the variable needs no rewriting:
#
#   sbx create claude <repo> <xilinx-version-dir>:ro <licence-dir>:ro \
#       --kit docker/finn.kit -e XILINXD_LICENSE_FILE=/path/to.lic ...
#
# The directory rather than the file: some licences have sibling lock/state
# files that Vivado writes next to them.
#
# WHY A KIT AND NOT THE ENTRYPOINT
#
# `sbx exec` starts a process directly in the container and does not go through
# the image ENTRYPOINT, so nothing finn_entrypoint.sh exports is visible to an
# exec session. `environment.variables` below becomes REAL process env, so it
# reaches every invocation style - `bash -c`, `sh -c`, and a bare
# `sbx exec <cmd>` with no shell at all. /etc/sandbox-persistent.sh reaches only
# bash (and is sbx-managed, so the image must not write it).
#
# The image still works with no kit: finn_paths.py resolves the same values from
# WORKSPACE_DIR at interpreter startup. The kit makes them available to
# non-Python consumers too.
#
# SCHEMA: kit schemaVersion 2 (sbx >= 0.36). v1 used `commands:`; v2 uses
# `setup:`. Both are accepted, but v1 is the legacy path, so new kits use v2.
# Grammars must not be mixed: v1 fields in a v2 spec are rejected at decode.
schemaVersion: "2"
kind: mixin
name: finn

environment:
  variables:
    # ${WORKSPACE_DIR} is interpolated by sbx at create time. This is the one
    # value that genuinely cannot be baked: the workspace has no fixed path.
    # See LIMITATION(finn-root-absolute) in docker/finn_paths.py.
    FINN_ROOT: "${WORKSPACE_DIR}"
    # Scratch for generated HLS/Vivado projects. Inside the VM on purpose: a
    # build tree that outlives the sandbox has nowhere to live, and writing it
    # into the mounted workspace is what this redesign removed.
    FINN_BUILD_DIR: "/tmp/finn_build"

setup:
  startup:
    # user "0" because startup commands default to "1000" (agent) and both of
    # these touch root-owned paths. Two other constraints from the kit
    # reference, both learned the hard way here:
    #   - the dispatcher STOPS on a failed command, so one that cannot succeed
    #     silently disables every command after it;
    #   - startup commands replay on every container restart, so they must be
    #     idempotent. The toolchain block below writes a separate file and
    #     sources it once, rather than appending to the sbx-managed file each
    #     time.
    - command: ["sh", "-c", "mkdir -p /tmp/finn_build && chmod 1777 /tmp/finn_build"]
      user: "0"

    # Publish the Xilinx toolchain environment to shell sessions.
    #
    # `sbx exec` does not run the image ENTRYPOINT, so the settings64.sh that
    # finn_entrypoint.sh sources into PID 1 is invisible to every later
    # session -- `vivado` is simply not on PATH. These variables cannot be
    # static kit values: sourcing settings64.sh produces a large, install- and
    # version-dependent set, and the tools are mounted, not baked.
    #
    # /etc/sandbox-persistent.sh is sbx-managed and sourced when bash starts,
    # which covers interactive sessions, `sbx run`, and `bash -c`. A bare
    # `sh -c` does not source it -- acceptable, because the consumers that
    # need Vivado are shells and Python (which resolves paths via finn_paths).
    #
    # No-op on the dev tier, which mounts no toolchain.
    - command:
        - bash
        - -c
        - |
          # NO `set -u`: Xilinx settings64.sh references unset variables and
          # would abort the shell mid-source, silently producing an empty file.
          # NO `set -e` either: a non-zero from a vendor script must not stop us.
          settings=""
          for p in "${VITIS_PATH:-}" "${VIVADO_PATH:-}" "${HLS_PATH:-}"; do
            [ -n "$p" ] && [ -f "$p/settings64.sh" ] && settings="$settings $p/settings64.sh"
          done
          [ -z "$settings" ] && exit 0
          for s in $settings; do . "$s" 2>/dev/null || true; done
          # Set only when a toolchain is actually present, so the dev tier -- which
          # sources nothing -- never pays for it.
          udev=$(ls /lib/*-linux-gnu/libudev.so.1 2>/dev/null | head -1)
          [ -n "$udev" ] && export LD_PRELOAD="${LD_PRELOAD:+$LD_PRELOAD:}$udev"
          {
            echo "# Xilinx toolchain env, published by the finn kit at startup."
            # LD_PRELOAD of libudev is a FLEXlm workaround, not decoration.
            # FLEXlm fingerprints the host through udev_enumerate_scan_devices
            # during checkout, and in a microVM that corrupts the heap: Vivado
            # dies with "realloc(): invalid pointer" and SIGABRT the moment it
            # asks for a licence. Preloading libudev avoids it.
            #
            # It has to be published here rather than exported by the
            # entrypoint, because `sbx exec` never runs the entrypoint -- which
            # is exactly how it went missing and took synthesis down with it.
            for v in PATH LD_LIBRARY_PATH LD_PRELOAD XILINX_VIVADO XILINX_VITIS XILINX_HLS XILINX_XRT; do
              eval "val=\${$v:-}"
              [ -n "$val" ] && printf 'export %s=%q\n' "$v" "$val"
            done
          } > /etc/finn-toolchain.sh
          grep -q finn-toolchain /etc/sandbox-persistent.sh 2>/dev/null \
            || echo ". /etc/finn-toolchain.sh" >> /etc/sandbox-persistent.sh
          # Explicit success. The block above ends on whatever the last test
          # returned, and the dispatcher STOPS the whole chain on a non-zero
          # exit -- which would silently disable any command added after this.
          exit 0
      user: "0"
