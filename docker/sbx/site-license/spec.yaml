{
  "schemaVersion": "2",
  "kind": "mixin",
  "name": "site-license",
  "displayName": "FlexLM licence server",
  "description": "Opens a FlexLM licence server's manager and vendor-daemon ports, and nothing else.",
  "args": {
    "host": {
      "required": true,
      "description": "The licence server's IPv4 address. FlexLM connections are plain TCP, matched by address, and a host name would also need DNS access.",
      "pattern": "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$"
    },
    "manager_port": {
      "required": true,
      "description": "Licence manager (lmgrd) port, as in XILINXD_LICENSE_FILE=port@host",
      "pattern": "^[0-9]{1,5}$"
    },
    "vendor_port": {
      "required": true,
      "description": "Vendor daemon (xilinxd) port; sbx policy log shows it when it is blocked",
      "pattern": "^[0-9]{1,5}$"
    }
  },
  "permissions": {
    "network": {
      "allow": [
        "${{ kit.args.host }}:${{ kit.args.manager_port }}",
        "${{ kit.args.host }}:${{ kit.args.vendor_port }}"
      ]
    }
  },
  "agentInstructions": {
    "content": "## Vivado licence\nThe licence server is reachable at ${{ kit.args.host }} (ports ${{ kit.args.manager_port }} and ${{ kit.args.vendor_port }}). Network access is otherwise whatever the sandbox policy allows. If Vivado reports that a valid licence was not found, or a download or fetch is blocked, the cause is the network policy, not the design: report the host and port rather than working around it or changing the design.\n"
  }
}
