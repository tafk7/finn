# syntax=docker/sandbox-kit:3
# Selects a mounted Xilinx installation and opens the licence server's two
# ports. The installation itself is a read-only mount of the sandbox (a kit
# cannot mount host paths).
#
# The arguments are FINN's machine file, ~/.config/finn/xilinx.env, which
# docker/run and native activation read too: pass it with --kit-args-file, and
# select another installed version for one sandbox with
# --kit-arg FINN_XILINX_VERSION=... . The workload's startup hook resolves
# XILINX_VIVADO/XILINX_VITIS/XILINX_HLS from the path and version (AMD's layout
# changed after 2024.2) into sbx's persistent environment.
schemaVersion: "3"
kind: mixin
displayName: Xilinx tools for FINN
description: >-
  Vivado, Vitis and HLS from a read-only mounted installation, and network
  access to a FlexLM licence server's manager and vendor-daemon ports only.
args:
  FINN_XILINX_PATH:
    required: true
    pattern: '^/.*'
    description: The installation root, as mounted (e.g. /opt/Xilinx)
    env: FINN_XILINX_PATH
  FINN_XILINX_VERSION:
    required: true
    description: The version to use from that root (e.g. 2025.2)
    env: FINN_XILINX_VERSION
  FINN_LICENSE_HOST:
    required: true
    pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    description: >-
      The licence server's IPv4 address. FlexLM is plain TCP, matched by
      address; a host name would also need DNS, which a closed policy blocks.
    env: FINN_LICENSE_HOST
  FINN_LICENSE_PORT:
    required: true
    pattern: '^[0-9]{1,5}$'
    description: Licence manager (lmgrd) port, as in XILINXD_LICENSE_FILE=port@host
    env: FINN_LICENSE_PORT
  FINN_LICENSE_VENDOR_PORT:
    required: true
    pattern: '^[0-9]{1,5}$'
    description: Vendor daemon (xilinxd) port; `sbx policy log` shows it when blocked
  PLATFORM_REPO_PATHS:
    default: ""
    description: Vitis platform directory, as mounted (optional)
    env: PLATFORM_REPO_PATHS
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "${{ kit.args.FINN_LICENSE_HOST }}:${{ kit.args.FINN_LICENSE_PORT }}"
          - "${{ kit.args.FINN_LICENSE_HOST }}:${{ kit.args.FINN_LICENSE_VENDOR_PORT }}"
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Xilinx tools
        Vivado, Vitis and HLS come from a read-only mounted installation. The
        licence server is reachable at ${{ kit.args.FINN_LICENSE_HOST }} (ports
        ${{ kit.args.FINN_LICENSE_PORT }} and ${{ kit.args.FINN_LICENSE_VENDOR_PORT }}). The
        toolchain (XILINX_VIVADO and the licence variable) is set in bash, so
        run tools and FINN's hardware flows from a bash shell. If Vivado
        reports that a valid licence was not found, or a download is blocked,
        the cause is the network policy, not the design: report the host and
        port rather than working around it or changing the design.
