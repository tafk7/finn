{
  "schemaVersion": "1",
  "args": {
    "name": {
      "required": true,
      "description": "Unique sandbox name"
    },
    "workspace": {
      "required": true,
      "description": "Absolute FINN checkout path"
    },
    "template": {
      "required": true,
      "description": "Image reference from docker/build --sbx --print-tag"
    },
    "agent": {
      "default": "shell",
      "description": "Native agent selection; personal settings belong in user configuration"
    }
  },
  "name": "${{ env.args.name }}",
  "workspace": "${{ env.args.workspace }}",
  "agent": "${{ env.args.agent }}",
  "sandboxOptions": {
    "template": "${{ env.args.template }}",
    "pullPolicy": "never",
    "shareSkills": false
  },
  "env": {
    "FINN_BUILD_DIR": "/tmp/finn_build"
  }
}
