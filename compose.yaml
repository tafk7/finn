# FINN's runtime services. The human-facing half of the container story.
#
#   docker compose run --rm dev                   Python work, no toolchain
#   docker compose run --rm dev quicktest.sh
#   docker compose --profile fpga run --rm build  Vivado / Vitis HLS
#   docker compose --profile fpga run --rm build-xrt
#   docker compose up notebook
#
# BEFORE YOU RUN THIS -- FOR EVERY SERVICE, INCLUDING dev
# -------------------------------------------------------
#
#   ./docker/finn-env inspect --tier dev --format sh > .env
#
# .env is a CACHE with a single producer. Delete and regenerate it if it looks
# stale; never hand-edit it.
#
# This step is NOT optional for dev, and an earlier version of this comment
# wrongly said it was. Compose cannot run `id -u`, so with no .env the `user:`
# key below falls back to 1000:1000. On any host whose uid is not 1000, the
# container then cannot write the bind-mounted workspace, and the failure is a
# bare `PermissionError` from whatever tries first -- not a message about uids.
#
# run-docker.sh does this for you. Plain Compose cannot.
#
# What dev DOES avoid is host state: no toolchain, no licence, no secrets, no
# egress. Only the workspace is mounted. If you find yourself adding a bind
# mount to `dev`, that is the signal to make an fpga-profile service instead.
#
# WORKSPACE PATH
# --------------
# `dev` mounts the checkout at /workspace/finn. The FPGA services mount it at
# its HOST path, because generated Vivado projects embed $::env(FINN_ROOT) as
# an absolute path via add_files -- so a project built under a fixed path
# cannot be opened in the host's Vivado GUI, which is routine debugging here.
# See LIMITATION(finn-root-absolute) in docker/finn_paths.py.
#
# Consequence worth knowing: FINN_ROOT differs between dev and the FPGA tiers
# on the same host. finn_paths.py resolves it correctly either way, but the
# path moving when you switch tiers is surprising the first time.

x-common: &common
  init: false            # the image has tini as PID 1; a second init is redundant
  working_dir: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
  # FINN_UID/FINN_GID, not UID/GID: bash marks UID readonly and does not export
  # it, so ${UID} here would silently resolve to the default and every file the
  # container wrote to the bind mount would be owned by uid 1000. `finn-env
  # inspect --format sh` emits both.
  user: "${FINN_UID:-1000}:${FINN_GID:-1000}"
  # NO `environment:` here. A YAML merge key does not deep-merge, so a service
  # defining its own `environment:` replaces this wholesale -- and all four do.
  # It looked like it was setting NUM_DEFAULT_WORKERS for every service and set
  # it for none. `docker compose config dev` shows the resolved truth.

# Everything an FPGA tier needs from the host, resolved by `finn-env inspect`.
# Read-only throughout: the tools do not write into their own installation, and
# an agent with write access to the Xilinx tree is the largest blast radius this
# container has.
x-toolchain: &toolchain
  XILINX_VIVADO: ${XILINX_VIVADO:-}
  XILINX_VITIS: ${XILINX_VITIS:-}
  XILINX_HLS: ${XILINX_HLS:-}
  VIVADO_PATH: ${VIVADO_PATH:-}
  VITIS_PATH: ${VITIS_PATH:-}
  HLS_PATH: ${HLS_PATH:-}
  PLATFORM_REPO_PATHS: ${PLATFORM_REPO_PATHS:-}
  XILINXD_LICENSE_FILE: ${XILINXD_LICENSE_FILE:-}
  LM_LICENSE_FILE: ${LM_LICENSE_FILE:-}

services:

  # The universal default. No toolchain, no licence, no secrets, no host
  # privilege, no FINN-specific egress -- only the workspace is mounted from
  # the host. This is the contract the conformance suite asserts, and the
  # reason automation needs no discovery protocol to run it.
  dev:
    <<: *common
    image: xilinx/finn:dev-${FINN_PROFILE:-py310}-${GIT_DESCRIBE:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.finn
      target: dev
      args:
        FINN_PROFILE: ${FINN_PROFILE:-py310}
    volumes:
      # Defaults to the fixed path. run-docker.sh overrides both through its own
      # env file so the legacy contract keeps mirroring the host path -- see the
      # note at the top of this file about FINN_ROOT differing between tiers.
      - ${FINN_WORKSPACE_SOURCE:-.}:${FINN_WORKSPACE_TARGET:-/workspace/finn}
      # The build directory. Without this, dev had no FINN_BUILD_DIR and no
      # mount, so finn_entrypoint.sh fell back to an in-container /tmp path and
      # `--rm` deleted every generated artifact on exit. The old launcher
      # mounted this unconditionally for every tier.
      #
      # This is scratch space, not host state in the sense the dev contract
      # means: no toolchain, no licence, no secrets.
      - ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}:${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
    working_dir: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
    environment:
      FINN_ROOT: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
      FINN_BUILD_DIR: ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
      FINN_DEPS: ${FINN_DEPS:-frozen}

  build:
    <<: *common
    profiles: [fpga]
    image: xilinx/finn:build-${FINN_PROFILE:-py310}-${GIT_DESCRIBE:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile.finn
      target: build
      args:
        FINN_PROFILE: ${FINN_PROFILE:-py310}
    volumes:
      - ${FINN_WORKSPACE_SOURCE:-.}:${FINN_WORKSPACE_TARGET:-/workspace/finn}
      # NOT ${FINN_XILINX_PATH:?...}. Compose interpolates EVERY service in the
      # file, not only the one you selected, so a `:?` here aborts
      # `docker compose run --rm dev` on any machine with no Xilinx configured
      # -- which is exactly the user the dev tier exists for. Same defect that
      # made bake refuse every target until it was given -f docker-bake.hcl.
      #
      # create_host_path: false so an unset value fails when you START this
      # service, with an error that names itself, instead of silently binding a
      # directory Docker helpfully created.
      - type: bind
        source: ${FINN_XILINX_PATH:-/FINN_XILINX_PATH-is-not-set}
        target: ${FINN_XILINX_PATH:-/FINN_XILINX_PATH-is-not-set}
        read_only: true
        bind:
          create_host_path: false
      - ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}:${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
    environment:
      <<: *toolchain
      FINN_ROOT: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
      FINN_BUILD_DIR: ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
      FINN_DEPS: ${FINN_DEPS:-frozen}

  build-xrt:
    <<: *common
    profiles: [fpga]
    image: xilinx/finn:${GIT_DESCRIBE:-local}.${XRT_DEB_VERSION:-xrt}
    build:
      context: .
      dockerfile: docker/Dockerfile.finn
      target: build-xrt
      args:
        FINN_PROFILE: ${FINN_PROFILE:-py310}
    volumes:
      - ${FINN_WORKSPACE_SOURCE:-.}:${FINN_WORKSPACE_TARGET:-/workspace/finn}
      - type: bind
        source: ${FINN_XILINX_PATH:-/FINN_XILINX_PATH-is-not-set}
        target: ${FINN_XILINX_PATH:-/FINN_XILINX_PATH-is-not-set}
        read_only: true
        bind:
          create_host_path: false
      - ${PLATFORM_REPO_PATHS:-/opt/xilinx/platforms}:${PLATFORM_REPO_PATHS:-/opt/xilinx/platforms}:ro
      - ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}:${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
    environment:
      <<: *toolchain
      FINN_ROOT: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
      FINN_BUILD_DIR: ${FINN_HOST_BUILD_DIR:-/tmp/finn_build_1000}
      FINN_DEPS: ${FINN_DEPS:-frozen}

  notebook:
    <<: *common
    profiles: [notebook]
    image: xilinx/finn:dev-${FINN_PROFILE:-py310}-${GIT_DESCRIBE:-local}
    volumes:
      - ${FINN_WORKSPACE_SOURCE:-.}:${FINN_WORKSPACE_TARGET:-/workspace/finn}
    working_dir: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
    environment:
      FINN_ROOT: ${FINN_WORKSPACE_TARGET:-/workspace/finn}
      FINN_DEPS: ${FINN_DEPS:-frozen}
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}
      NETRON_PORT: ${NETRON_PORT:-8081}
    ports:
      - "${JUPYTER_PORT:-8888}:${JUPYTER_PORT:-8888}"
      - "${NETRON_PORT:-8081}:${NETRON_PORT:-8081}"
    command: >
      jupyter notebook --no-browser --ip=0.0.0.0
      --port ${JUPYTER_PORT:-8888} notebooks
