[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
version = "0.0.0"
description = "A Framework for Fast, Scalable Quantized Neural Network Inference"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yaman Umuroglu"}, {name = "Jakoba Petri-Koenig", email = "jakoba.petri-koenig@amd.com"}]
requires-python = ">=3.12,<3.13"
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python", "Operating System :: POSIX :: Linux"]
dependencies = [
    # Lower bounds are the versions upstream dev tests (requirements.txt, the image).
    "bitstring>=4.2.3",
    "clize>=5.0.1",
    "dataclasses-json>=0.5.7",
    "numpy>=1.26.4,<2.4",  # 2.4: qonnx IntQuant.get_integer_datatype int()s a shape-(1,) bit width
    "onnx>=1.22.0",
    "onnxruntime>=1.32.0",  # reads the IR version onnx 1.23 writes
    "onnxscript>=0.6.2,<0.7",  # loop rolling uses its private rewriter, reworked in 0.7
    "pybind11>=2.11.1",
    "qonnx @ git+https://github.com/fastmachinelearning/qonnx.git@4c1f9b4452bb90e743f3bd7e182603fa5096af06",
]

[project.optional-dependencies]
# The Brevitas front end: training, quantizing and exporting PyTorch models to QONNX.
# FINN compiles a QONNX model without it.
brevitas = [
    "brevitas>=0.13.4",
    "onnxoptimizer>=0.4.2",  # brevitas exports through it, without declaring it
    # From 2.9 brevitas exports with dynamo by default, whose opset 18+ graphs FINN
    # cannot read yet: export with dynamo=False.
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[project.urls]
Homepage = "https://xilinx.github.io/finn/"
Documentation = "https://finn.readthedocs.io/"

[project.scripts]
finn = "finn.cli:main"
build_dataflow = "finn.builder.build_dataflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finn = ["resources.toml", "qnn-data/**/*", "_sources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[dependency-groups]
test = [
    "finn[brevitas]",
    "setuptools>=77",  # test_wheel builds FINN with it
    "pytest==7.4.4",
    "pytest-xdist[setproctitle]==3.2.0",
]
ci = [
    {"include-group" = "test"},
    {"include-group" = "notebooks"},
    "pytest-html==4.1.1",
    "pytest-html-merger==0.1.0",
    "pytest-cov==4.1.0",
]
notebooks = [
    "ipython==8.18.1",
    "ipykernel==6.29.0",
    "matplotlib>=3.9",  # numpy 2
    "netron",
    "pandas>=2.2.2,<3",  # numpy 2
    "scikit-learn>=1.5",  # numpy 2
    "tqdm==4.64.1",
    "jupyter==1.0.0",
]
docs = [
    {"include-group" = "ci"},
    "docutils==0.18.1",
    "sphinx==5.0.2",
    "sphinx-rtd-theme==2.0.0",
]
# The PyTorch build, selected by the index each group's sources name.
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]
dev = [
    {"include-group" = "docs"},
    "pre-commit==3.5.0",
]

[tool.uv]
required-version = "==0.10.0"
default-groups = ["dev", "cpu"]
conflicts = [[{group = "cpu"}, {group = "cuda"}]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# PyTorch builds: CPU by default; `uv sync --no-group cpu --group cuda` selects CUDA.
torch = [{index = "pytorch-cpu", group = "cpu"}, {index = "pytorch-cu132", group = "cuda"}]
torchvision = [{index = "pytorch-cpu", group = "cpu"}, {index = "pytorch-cu132", group = "cuda"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]
norecursedirs = ["dist", "build", ".tox", ".venv"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "vivado: mark tests that require Vivado or Vivado HLS",
    "vitis: mark tests that require Vitis",
    "board: mark tests that require a PYNQ board",
    "brevitas_export : mark tests that test brevitas export functionality",
    "streamline: mark tests that test streamlining functionality",
    "util: mark tests that test util functions",
    "transform: mark tests that test transformations (before hls layers)",
    "fpgadataflow: mark tests related to hls layers",
    "end2end: mark tests that run the end2end flow",
    "notebooks: mark tests that execute all Jupyter notebooks",
    "sanity_bnn: mark tests that execute the sanity BNN test",
    "bnn_u55c: mark tests that execute U55C BNN tests",
    "bnn_kv260: mark tests that execute KV260 BNN tests",
    "bnn_aup_zu3: mark tests that execute AUP-ZU3 BNN tests",
    "bnn_zcu104: mark tests that execute ZCU104 BNN tests",
    "finn_examples: mark tests that run finn examples",
    "fifo_sizing: mark finn-examples FIFO sizing tests",
    "node_tree_modeling: mark tests for analytical FIFO sizing tree models",
]
