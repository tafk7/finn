[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
dynamic = ["version"]
description = "A Framework for Fast, Scalable Quantized Neural Network Inference"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Yaman Umuroglu"}, {name = "Jakoba Petri-Koenig", email = "jakoba.petri-koenig@amd.com"}]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Lower bounds are tested: .github/workflows/dependencies.yml runs at them weekly.
    "bitstring>=4.2.3",
    "clize>=5.0.1",
    "dataclasses-json>=0.5.7",
    "numpy>=1.26.4,<2.4",  # 2.4: qonnx IntQuant.get_integer_datatype int()s a shape-(1,) bit width
    "onnx>=1.22.0",
    "onnxruntime>=1.32.0",  # reads the IR version onnx 1.23 writes
    "onnxscript>=0.6.2,<0.7",  # loop rolling uses its private rewriter, reworked in 0.7
    "pybind11>=2.11.1",
    "qonnx @ git+https://github.com/fastmachinelearning/qonnx.git@4c1f9b4452bb90e743f3bd7e182603fa5096af06",
]

[project.optional-dependencies]
# The Brevitas front end: training, quantizing and exporting PyTorch models to QONNX.
# FINN compiles a QONNX model without it.
brevitas = [
    "brevitas>=0.13.4",
    "onnxoptimizer>=0.4.2",  # brevitas exports through it, without declaring it
    "pillow>=10",  # finn.util.imagenet
    # From 2.9 brevitas exports with dynamo by default, whose opset 18+ graphs FINN
    # cannot read yet: export with dynamo=False.
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[project.urls]
Homepage = "https://xilinx.github.io/finn/"
Documentation = "https://finn.readthedocs.io/"

[project.scripts]
finn = "finn.cli:main"
build_dataflow = "finn.builder.build_dataflow:main"

[tool.setuptools_scm]
# the version comes from the git tags; a tree without git metadata (a worktree
# mounted without its repository) builds as this
fallback_version = "0.0.0+unknown"

[tool.setuptools_scm.scm.git]
# release tags only: the archive/* tags carry digits too
describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.setuptools]
# package-data below, not the file list setuptools-scm takes from git: git lists
# the _sources links as files, and the wheel build fails copying them
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finn = ["resources.toml", "qnn-data/**/*", "_sources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[dependency-groups]
test = [
    "finn[brevitas]",
    "setuptools>=77",  # test_wheel builds FINN with it
    "setuptools-scm>=8",  # and the builds without isolation (the container's)
    "pytest>=9",
    "pytest-xdist[setproctitle]>=3.8",
]
ci = [
    {"include-group" = "test"},
    {"include-group" = "notebooks"},
    # these versions of pytest plugins allow for stable collection of test reports and
    # code coverage reports in HTML.
    # pytest-html 4.x is required on Python 3.12: 3.0.0 imports the removed py.xml (from
    # the unmaintained py library) and fails to load as a pytest plugin. 4.x uses jinja2
    # templates instead; it needs pytest-metadata>=2, and pytest-html-merger 0.1.0 for
    # the 4.x report format.
    "pytest-html>=4.1.1",
    "pytest-html-merger>=0.1",
    "pytest-cov>=7",
]
notebooks = [
    "ipykernel>=6.29",
    "ipython>=8.18",
    "jupyter>=1.1",
    "matplotlib>=3.9",  # numpy 2
    "nbconvert>=7.16",  # test_jupyter_notebooks runs them
    "nbformat>=5.10",
    # Beyond version 8.5.0, subsequent Netron calls in a Jupyter notebook cause "Address
    # already in use" errors
    "netron",
    "pandas>=2.2.2,<3",  # numpy 2
    "scikit-learn>=1.5",  # numpy 2
    "tqdm>=4.66",
]
# Sphinx and FINN's runtime: conf.py mocks the front end's imports for autodoc.
docs = [
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3",
]
# The PyTorch build, selected by the index each group's sources name.
cpu = ["torch", "torchvision"]
cuda = ["torch", "torchvision"]
dev = [
    {"include-group" = "ci"},
    {"include-group" = "docs"},
    "pre-commit>=4",
]

[tool.uv]
# reinstall the editable FINN when a commit or tag changes its version
cache-keys = [{file = "pyproject.toml"}, {git = {commit = true, tags = true}}]
required-version = "==0.10.0"
default-groups = ["dev", "cpu"]
conflicts = [[{group = "cpu"}, {group = "cuda"}]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch's bare releases on the PyTorch index carry only macOS wheels: require a Linux one
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# PyTorch builds: CPU by default; `uv sync --no-group cpu --group cuda` selects CUDA.
torch = [{index = "pytorch-cpu", group = "cpu"}, {index = "pytorch-cu132", group = "cuda"}]
torchvision = [{index = "pytorch-cpu", group = "cpu"}, {index = "pytorch-cu132", group = "cuda"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
addopts = "--verbose"
pythonpath = ["tests"]  # finn_test_helpers
testpaths = ["tests"]
norecursedirs = ["dist", "build", ".tox", ".venv"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "vivado: mark tests that require Vivado or Vivado HLS",
    "vitis: mark tests that require Vitis",
    "board: mark tests that require a PYNQ board",
    "brevitas_export : mark tests that test brevitas export functionality",
    "streamline: mark tests that test streamlining functionality",
    "util: mark tests that test util functions",
    "transform: mark tests that test transformations (before hls layers)",
    "fpgadataflow: mark tests related to hls layers",
    "end2end: mark tests that run the end2end flow",
    "notebooks: mark tests that execute all Jupyter notebooks",
    "sanity_bnn: mark tests that execute the sanity BNN test",
    "bnn_u55c: mark tests that execute U55C BNN tests",
    "bnn_kv260: mark tests that execute KV260 BNN tests",
    "bnn_aup_zu3: mark tests that execute AUP-ZU3 BNN tests",
    "bnn_zcu104: mark tests that execute ZCU104 BNN tests",
    "finn_examples: mark tests that run finn examples",
    "fifo_sizing: mark finn-examples FIFO sizing tests",
    "node_tree_modeling: mark tests for analytical FIFO sizing tree models",
]
