[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
description = "A Framework for Fast, Scalable Quantized Neural Network Inference"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Yaman Umuroglu" },
    { name = "Jakoba Petri-Koenig", email = "jakoba.petri-koenig@amd.com" },
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]
# What FINN itself imports. Ranges start at the tested versions; uv.lock records
# the exact environment used for development, CI and the images.
dependencies = [
    "bitstring>=4.2.3,<5",
    "clize>=5.0.1,<6",
    "dataclasses-json>=0.5.7,<0.7",
    # finn.core.space evaluates computations on greenlets.
    "greenlet>=3.2.4,<4",
    "numpy>=1.26.4,<2",
    "onnx>=1.22.0,<1.23",
    "onnx-ir>=1.0.0,<2",
    "onnxruntime>=1.28.0,<1.29",
    "onnxscript>=0.6.2,<0.7",
    "pybind11>=2.11.1,<3",
    # finn.kernels.artifacts: the RTL interface checker.
    "pyslang>=11.0.0,<12",
    "qonnx>=1.0.0",
    "scipy>=1.11.4,<2",
    "torch>=2.8.0,<3",
]

[project.urls]
Homepage = "https://xilinx.github.io/finn/"
Documentation = "https://finn.readthedocs.io/"
Source = "https://github.com/Xilinx/finn"

[project.scripts]
build_dataflow = "finn.builder.build_dataflow:main"
finn-resources = "finn.resources._cli:main"

[dependency-groups]
test = [
    # Packaging tests build FINN wheels without isolation.
    "build>=1.2.2",
    "setuptools>=68.2.2",
    "wheel>=0.45.1",
    "brevitas",
    "dataset-loading",
    "hypothesis>=6.167.1,<7",
    "importlib-resources>=6.1.0",
    "nbconvert>=7",
    "nbformat>=5",
    # Brevitas' ONNX export imports it.
    "onnxoptimizer",
    "pillow",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-dependency==0.5.1",
    "pytest-html==4.1.1",
    "pytest-html-merger==0.1.0",
    "pytest-metadata==3.1.1",
    "pytest-parallel==0.1.1",
    "pytest-xdist[setproctitle]==3.2.0",
    "torchvision>=0.23.0,<1",
    "wget>=3.2",
]
notebooks = [
    "ipykernel>=6.29.0",
    "ipython>=8.18.1",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.2",
    "netron",
    "pandas>=2.1.4,<3",
    "scikit-learn>=1.4.0",
    "tqdm>=4.64.1",
]
# autodoc imports every module, including test and notebook helpers.
docs = [
    { include-group = "test" },
    { include-group = "notebooks" },
    "docutils>=0.18.1,<0.20",
    "sphinx>=5.0.2,<6",
    "sphinx-rtd-theme>=2.0.0,<3",
]
# Format, lint and strict typing of finn.core.space, finn.dataflow and finn.kernels
# (scripts/check-*.sh).
gates = [
    "mypy==2.3.1",
    "ruff==0.16.4",
]
dev = [
    { include-group = "docs" },
    { include-group = "gates" },
    "pip",
    "pre-commit>=3.5.0",
]

[tool.uv]
default-groups = ["dev"]
# The environment FINN is developed and tested in (the image's Python). Users
# installing the published package are not limited to it.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'"]
constraint-dependencies = [
    # anyio>=4.13 breaks pytest plugin loading through jupyter, with no metadata
    # conflict for the resolver to see.
    "anyio<4.13",
    # Tested build backend versions.
    "build==1.2.2.post1",
    "setuptools==68.2.2",
    "wheel==0.45.1",
]

[tool.uv.sources]
# Unreleased commits FINN is developed against. Development and CI only: published
# metadata carries the plain requirements above.
qonnx = { git = "https://github.com/tafk7/qonnx.git", rev = "06f00c27b23219af459ec927cdaf9dc52c1f39e0" }
brevitas = { git = "https://github.com/Xilinx/brevitas.git", rev = "aad4d5a293db6f2ec622a92a5d3278e47072453e" }
dataset-loading = { git = "https://github.com/fbcotter/dataset_loading.git", rev = "5b9faa226e5f7c857579d31cdd9acde8cdfb816f" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
# The strict gates (scripts/check-*.sh) pass --strict and the packages and test
# directories they check on the command line; this section carries the
# exclusions from those directories and the overrides below.
#
# Kernel tests not yet strictly typed (2026-10-05: 587 errors, 480 of them
# missing annotations). Each file leaves this list once it passes; a new file
# is checked from the start. exclude only stops a file being found under a
# directory: the helpers among them, which checked tests import, are also
# silenced as imports in the override below.
exclude = [
    '^tests/kernel_ops/test_matmul\.py$',
    '^tests/kernel_ops/test_metadata\.py$',
    '^tests/kernel_ops/test_package\.py$',
    '^tests/kernel_ops/test_partition_facts\.py$',
    '^tests/kernel_ops/test_partition_formation\.py$',
    '^tests/kernel_ops/test_roots\.py$',
    '^tests/kernel_ops/test_tfc\.py$',
    '^tests/kernel_ops/test_thresholding\.py$',
    '^tests/kernel_ops/test_transforms\.py$',
    '^tests/kernel_ops/test_zynq_build\.py$',
    '^tests/kernel_ops/tfc\.py$',
    '^tests/kernels/conformance\.py$',
    '^tests/kernels/rtlsim/adapter_numeric\.py$',
    '^tests/kernels/rtlsim/dotp_support\.py$',
    '^tests/kernels/rtlsim/matmul_numeric\.py$',
    '^tests/kernels/rtlsim/pure_dot_product_numeric\.py$',
    '^tests/kernels/rtlsim/rtl_transport\.py$',
    '^tests/kernels/rtlsim/test_observed_transport\.py$',
    '^tests/kernels/test_adapters\.py$',
    '^tests/kernels/test_axi_stream_port\.py$',
    '^tests/kernels/test_axi_stream\.py$',
    '^tests/kernels/test_clocking\.py$',
    '^tests/kernels/test_conformance\.py$',
    '^tests/kernels/test_declared_streams\.py$',
    '^tests/kernels/test_design\.py$',
    '^tests/kernels/test_dotp\.py$',
    '^tests/kernels/test_flat_kernels\.py$',
    '^tests/kernels/test_integer_tensor_value\.py$',
    '^tests/kernels/test_interfaces\.py$',
    '^tests/kernels/test_kernel_extensions\.py$',
    '^tests/kernels/test_kernel_module\.py$',
    '^tests/kernels/test_matmul_assembly\.py$',
    '^tests/kernels/test_matmul_depthwise\.py$',
    '^tests/kernels/test_matmul_replay\.py$',
    '^tests/kernels/test_memstream\.py$',
    '^tests/kernels/test_migrated_rich\.py$',
    '^tests/kernels/test_migrated_simple\.py$',
    '^tests/kernels/test_native_streams\.py$',
    '^tests/kernels/test_port_contracts\.py$',
    '^tests/kernels/test_scalar_policies\.py$',
    '^tests/kernels/test_stream_contract\.py$',
    '^tests/kernels/test_stream_plans\.py$',
    '^tests/kernels/test_stream_source\.py$',
    '^tests/kernels/test_threshold_memory\.py$',
    '^tests/kernels/test_two_kernels\.py$',
    '^tests/kernels/test_xsim_harness\.py$',
    '^tests/kernels/xsim\.py$',
]

[[tool.mypy.overrides]]
# The excluded kernel test modules that checked tests import (see exclude above).
# follow_imports rather than ignore_errors, as for finn.xsi below: they stay
# checkable when named on the command line.
module = ["kernels.conformance", "kernels.test_design", "kernels.test_stream_source", "kernels.xsim"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# finn.xsi loads Vivado's simulation extension by manipulating sys.path at call
# time, so its imports cannot be resolved statically. follow_imports rather than
# ignore_errors: it stops the module being checked as a side effect of an import,
# but leaves it checkable when it is named on the command line.
module = ["finn.xsi", "finn.xsi.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# QONNX ships no type information.
module = ["qonnx", "qonnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyslang 11's generated stubs do not parse (a parameter named `with`).
module = ["pyslang", "pyslang.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# The compiled extension, which exists only after its first-use build.
module = ["finn_xsi.*", "xsi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--verbose"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "vivado: mark tests that require Vivado or Vivado HLS",
    "xsim: kernel tests that run XSim (deselected by check-kernels.sh, run by xsim-sweep.sh)",
    "vitis: mark tests that require Vitis",
    "board: mark tests that require a PYNQ board",
    "brevitas_export : mark tests that test brevitas export functionality",
    "streamline: mark tests that test streamlining functionality",
    "util: mark tests that test util functions",
    "transform: mark tests that test transformations (before hls layers)",
    "fpgadataflow: mark tests related to hls layers",
    "end2end: mark tests that run the end2end flow",
    "notebooks: mark tests that execute all Jupyter notebooks",
    "sanity_bnn: mark tests that execute the sanity BNN test",
    "bnn_u55c: mark tests that execute U55C BNN tests",
    "bnn_kv260: mark tests that execute KV260 BNN tests",
    "bnn_aup_zu3: mark tests that execute AUP-ZU3 BNN tests",
    "bnn_zcu104: mark tests that execute ZCU104 BNN tests",
    "container: mark tests that require a container runtime or host toolchain",
]
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]
